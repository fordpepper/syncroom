:root{--ink:#161616;--bg:#f6f5f1;--soft:#e8e6df;--dim:#8d8d86}
*{box-sizing:border-box;text-transform:lowercase;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:800 18px/1.3 jb,"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-synthesis:none;
  display:flex;align-items:center;justify-content:center;min-height:100dvh;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{width:min(400px,100%);padding:24px;display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center}
section{width:100%;display:flex;flex-direction:column;align-items:center;gap:22px}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit;outline:none}
.dim{color:var(--dim)}
.small{font-size:14px}

/* buttons: filled and squared like the font, no lines */
.btn,.ib{background:var(--soft);color:var(--ink);border:0;cursor:pointer;transition:transform .08s,filter .12s}
.btn{border-radius:10px;padding:14px 20px}
.btn.xl{font-size:26px;padding:18px 44px;border-radius:12px}
.ib{width:60px;height:60px;border-radius:10px;display:grid;place-items:center;padding:0}
.ib.main{width:84px;height:84px;border-radius:12px;background:var(--ink);color:var(--bg)}
.btn.p,.ib.p,.ib.on{background:var(--ink);color:var(--bg)}
.btn:hover,.ib:hover{filter:brightness(.96)}
.btn:active,.ib:active{transform:scale(.96)}
.btn:focus-visible,.ib:focus-visible{filter:brightness(.88)}
.btn:disabled,.ib:disabled{opacity:.3;cursor:default;pointer-events:none}
.ib svg{width:28px;height:28px}
.ib.main svg{width:36px;height:36px}
svg.f{fill:currentColor;stroke:none}
svg.s{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:square;stroke-linejoin:miter}
.row{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.transport{gap:14px}

#codeIn{width:calc(6ch + 40px);text-align:center;background:var(--soft);border:0;border-radius:10px;
  padding:16px 12px 16px calc(12px + .2em);letter-spacing:.2em;font-size:24px}
#codeIn::placeholder{color:var(--dim);letter-spacing:0}
#codeIn:focus{background:#dedbd3}

.codebox{display:flex;flex-direction:column;align-items:center;gap:8px}
#code{font-size:68px;line-height:1;letter-spacing:.14em;background:var(--soft);border-radius:12px;padding:14px 8px 14px calc(8px + .14em)}

#title,#gtitle{font-size:22px;word-break:break-word;min-height:1.3em;line-height:1.3}
#gtitle{background:none;border:0;padding:6px 10px;cursor:pointer;border-radius:8px}
#gtitle:active{background:var(--soft)}

/* custom sliders (so ios can't restyle them) */
.sl{position:relative;width:calc(100% - 12px);height:28px;touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none}
.sl::before{content:"";position:absolute;left:0;right:0;top:11px;height:6px;border-radius:3px;background:var(--soft)}
.sl .fill{position:absolute;left:0;top:11px;height:6px;border-radius:3px;background:var(--ink);width:0}
.sl .knob{position:absolute;top:2px;left:0;width:12px;height:24px;margin-left:-6px;border-radius:4px;background:var(--ink)}
.sl.off{opacity:.3;pointer-events:none}
.vrow{width:100%;display:flex;align-items:center;gap:14px}
.vrow .sl{flex:1;width:auto;margin-right:6px}
.vic{width:26px;height:26px;flex:none}

#queue{width:100%;max-height:22vh;overflow:auto;display:flex;flex-direction:column;gap:2px}
#queue button{background:none;border:0;border-radius:10px;padding:7px 10px;color:var(--dim);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;width:100%}
#queue button:hover{background:var(--soft)}
#queue button.cur{color:var(--ink);background:var(--soft)}
#msg{min-height:1.3em;font-size:14px;color:var(--dim)}
</style>
</head>
<body>
<main>
  <section id="v-home">
    <button id="start" class="btn p xl">start</button>
    <input id="codeIn" maxlength="3" placeholder="code" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="room code">
  </section>

  <section id="v-host" hidden>
    <div class="codebox">
      <span class="dim small">room code</span>
      <div id="code"></div>
      <span id="count" class="dim small">0 listening</span>
    </div>

    <div id="title">add music</div>

    <div class="sl off" id="seek" role="slider" tabindex="0" aria-label="position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i class="fill"></i><b class="knob"></b></div>

    <div class="row transport">
      <button id="prev" class="ib" aria-label="previous" disabled>
        <svg class="f" viewBox="0 0 32 32" style="transform:scaleX(-1)"><path d="M7 7v18l14-9z"/><rect x="23" y="7" width="3.5" height="18"/></svg>
      </button>
      <button id="play" class="ib main" aria-label="play" disabled>
        <svg class="f" id="iPlay" viewBox="0 0 32 32"><path d="M9 5v22l18-11z"/></svg>
        <svg class="f" id="iPause" viewBox="0 0 32 32" hidden><rect x="7" y="6" width="7" height="20"/><rect x="18" y="6" width="7" height="20"/></svg>
      </button>
      <button id="next" class="ib" aria-label="next" disabled>
        <svg class="f" viewBox="0 0 32 32"><path d="M7 7v18l14-9z"/><rect x="23" y="7" width="3.5" height="18"/></svg>
      </button>
    </div>

    <div class="vrow">
      <svg class="s vic" viewBox="0 0 32 32" aria-hidden="true"><path d="M5 12h5l8-6v20l-8-6H5z"/><path d="M23 11c2 3 2 7 0 10"/></svg>
      <div class="sl" id="vol" role="slider" tabindex="0" aria-label="volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><i class="fill"></i><b class="knob"></b></div>
    </div>

    <div class="row">
      <button id="add" class="ib p" aria-label="add music" title="add music">
        <svg class="s" viewBox="0 0 32 32"><path d="M16 6v20M6 16h20"/></svg>
      </button>
      <button id="mode" class="ib" aria-label="in order" title="in order / shuffle">
        <svg class="s" id="iOrder" viewBox="0 0 32 32"><path d="M4 16h22M19 8l8 8-8 8"/></svg>
        <svg class="s" id="iShuf" viewBox="0 0 32 32" hidden><path d="M4 10h6l11 12h5M4 22h6l3.4-3.8M17.6 13.8L21 10h5M22 5l5 5-5 5M22 17l5 5-5 5"/></svg>
      </button>
      <button id="clear" class="ib" aria-label="clear" title="clear">
        <svg class="s" viewBox="0 0 32 32"><path d="M6 9h20M12 9V5h8v4M9 9l1.5 18h11L23 9"/></svg>
      </button>
    </div>
    <input id="files" type="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.opus,.flac" multiple hidden>

    <div id="queue"></div>
  </section>

  <section id="v-guest" hidden>
    <button id="gtitle"></button>
    <div id="gsub" class="dim small"></div>
    <button id="gplay" class="ib main" aria-label="play" disabled>
      <svg class="f" id="gPlay" viewBox="0 0 32 32"><path d="M9 5v22l18-11z"/></svg>
      <svg class="f" id="gPause" viewBox="0 0 32 32" hidden><rect x="7" y="6" width="7" height="20"/><rect x="18" y="6" width="7" height="20"/></svg>
    </button>
    <button id="back" class="ib" aria-label="back" hidden>
      <svg class="s" viewBox="0 0 32 32"><path d="M26 16H6M14 8l-8 8 8 8"/></svg>
    </button>
  </section>

  <div id="msg" role="status" aria-live="polite"></div>
</main>

<audio id="audio" playsinline preload="auto"></audio>

"use strict";
// PREFIX: any random string, keeps your rooms apart from other apps on the public broker.
// BITRATE: opus bits/s sent to each listener (lower = better on bad wifi).
// JITTER: how many ms listeners buffer to ride out wifi hiccups.
const PREFIX = "syncroom-x7q2-", ALPHA = "abcdefghijklmnopqrstuvwxyz";
const BITRATE = 64000, JITTER = 150, CHUNK = 16000;
const SILENT = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=";
const $ = id => document.getElementById(id), audio = $("audio");
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmt = s => { s = Math.max(0, s || 0); return Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0"); };
const clean = n => n.replace(/\.[^.]+$/, "");
const view = v => ["home", "host", "guest"].forEach(x => $("v-" + x).hidden = x !== v);
const msg = t => { $("msg").textContent = t || ""; };
const shuffleArr = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// stereo opus tuned for music: fixed modest bitrate, error correction, no silence gaps
function opusSdp(sdp) {

  if (!m) return sdp;
  const pt = m[1];

/* custom slider: value 0..1 */
function slider(el, o) {
  let v = 0, drag = false;
  const set = x => {
    v = Math.min(1, Math.max(0, x)); const p = v * 100 + "%";

}

/* =====================================================================

   ===================================================================== */

const lats = new Map();              // peerId -> listener delay in ms

async function keepAwake() { try { if (navigator.wakeLock) wake = await navigator.wakeLock.request("screen"); } catch (e) {} }
document.addEventListener("visibilitychange", () => { if (role === "host" && document.visibilityState === "visible") { keepAwake(); if (ctx) ctx.resume(); } });

function startHost(n = 0) {
  msg("");
  code = Array.from({ length: 3 }, () => ALPHA[Math.floor(Math.random() * ALPHA.length)]).join("");
  peer = new Peer(PREFIX + code);
  peer.on("open", () => { role = "host"; $("code").textContent = code; view("host"); keepAwake(); });

function onGuest(conn) {

async function sendFile(g) {

/* ----- queue ----- */

  if (!order.length) return;
  pos = ((p % order.length) + order.length) % order.length;
  const t = tracks.get(order[pos]);
  if (curUrl) URL.revokeObjectURL(curUrl);
  curUrl = URL.createObjectURL(t.file);
  audio.src = curUrl;

function addFiles(list) {
  const fs = [...list].filter(f => /^audio\//.test(f.type) || /\.(mp3|m4a|aac|wav|ogg|oga|opus|flac)$/i.test(f.name));

  if (curUrl) { URL.revokeObjectURL(curUrl); curUrl = null; }

  $("title").textContent = "add music";
  seekS.set(0);
  ui(); renderQueue(); broadcast(nowMsg());
}

  const has = pos >= 0;
  ["play", "prev", "next"].forEach(i => $(i).disabled = !has);
  $("seek").classList.toggle("off", !has);
  $("iPlay").toggleAttribute("hidden", !audio.paused); $("iPause").toggleAttribute("hidden", audio.paused);
  $("play").setAttribute("aria-label", audio.paused ? "play" : "pause");
}

/* ----- host controls ----- */
const seekS = slider($("seek"), {
  change: v => { if (audio.duration) audio.currentTime = v * audio.duration; }
});
const volS = slider($("vol"), { input: v => { if (master) master.gain.value = v * v; } });
volS.set(1);

$("add").onclick = () => $("files").click();
$("files").addEventListener("change", e => { addFiles(e.target.files); e.target.value = ""; });
$("play").onclick = () => { ctx.resume(); if (audio.paused) audio.play().catch(() => {}); else audio.pause(); };
$("prev").onclick = () => select(pos - 1, true);
$("next").onclick = () => select(pos + 1, true);
$("mode").onclick = () => {
  shuffle = !shuffle;
  $("iOrder").toggleAttribute("hidden", shuffle); $("iShuf").toggleAttribute("hidden", !shuffle);
  $("mode").classList.toggle("on", shuffle); $("mode").setAttribute("aria-label", shuffle ? "shuffle" : "in order");

$("clear").onclick = clearAll;

audio.addEventListener("play", () => { if (role === "host") ui(); else if (role === "guest") gui(); });
audio.addEventListener("pause", () => { if (role === "host") ui(); else if (role === "guest") gui(); });
audio.addEventListener("ended", () => { if (role === "host") select(pos + 1, true); });
audio.addEventListener("timeupdate", () => {
  if (role !== "host" || seekS.dragging || !audio.duration) return;
  seekS.set(audio.currentTime / audio.duration);
});

  $("gPlay").toggleAttribute("hidden", !audio.paused); $("gPause").toggleAttribute("hidden", audio.paused);
  $("gplay").setAttribute("aria-label", audio.paused ? "play" : "pause");
}
$("gplay").onclick = () => {
  if (!audio.srcObject) return;
  if (audio.paused) { wantPlay = true; audio.play().catch(() => msg("tap play again")); } else { wantPlay = false; audio.pause(); }
};
document.addEventListener("click", retry); document.addEventListener("touchend", retry);

function joinRoom(c) {
  code = c.toLowerCase().replace(/[^a-z]/g, "");
  if (code.length !== 3) return;
  unlock();
  msg("connecting");
  peer = new Peer();
  peer.on("call", call => {
    gcall = call;
    call.answer(undefined, { sdpTransform: opusSdp });
    call.on("stream", s => {
      audio.srcObject = s;
      $("gplay").disabled = false; gui();
      audio.play().catch(() => msg("tap play"));
      try { call.peerConnection.getReceivers().forEach(r => { if ("jitterBufferTarget" in r) r.jitterBufferTarget = JITTER; }); } catch (e) {}
      clearInterval(statTimer); statTimer = setInterval(report, 2000);
    });
    call.on("close", gone);
  });
  peer.on("open", () => {
    conn = peer.connect(PREFIX + code, { reliable: true });
    conn.on("open", () => { role = "guest"; msg(""); view("guest"); $("gtitle").textContent = code; });
    conn.on("data", onData);
    conn.on("close", gone);
  });
  peer.on("error", e => {
    if (e.type === "peer-unavailable") { msg("no room " + code); $("codeIn").value = ""; view("home"); }
    else msg(e.type);
  });
}
function gone() { clearInterval(statTimer); audio.pause(); $("gplay").disabled = true; $("gsub").textContent = "disconnected"; $("back").hidden = false; }

function onData(d) {
  if (!d || !d.t) return;
  if (d.t === "now") {
    hasTitle = !!d.name;
    $("gtitle").textContent = d.name || code;
    if (!dl) $("gsub").textContent = hasTitle ? "tap the title to save" : "";
  } else if (d.t === "dlmeta") {
    dl = { name: d.name, mime: d.mime, total: d.total, parts: new Array(d.total), got: 0 };
  } else if (d.t === "dl" && dl) {
    dl.parts[d.i] = d.d; dl.got++;
    $("gsub").textContent = "saving " + Math.floor(dl.got / dl.total * 100) + "%";
    if (dl.got === dl.total) {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob(dl.parts, { type: dl.mime }));
      a.download = dl.name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 60000);
      dl = null; $("gsub").textContent = "saved";
    }
  }
}

$("gtitle").onclick = () => {
  if (!conn || !conn.open || !hasTitle || dl) return;
  dl = { name: "", mime: "", total: 0, parts: [], got: 0, wait: true };   // placeholder until the host answers
  $("gsub").textContent = "saving 0%";
  conn.send({ t: "get" });
};
$("back").onclick = () => { location.href = location.pathname; };

// every 2s: tell the host how late our sound is (so it can line up), and shout if the sound breaks up while saving
async function report() {
  retry();
  if (!gcall || !conn || !conn.open) return;
  try {
    const st = await gcall.peerConnection.getStats();
    let cur = null, rtt = 0;
    st.forEach(r => {
      if (r.type === "inbound-rtp" && r.kind === "audio") cur = { d: r.jitterBufferDelay, n: r.jitterBufferEmittedCount, c: r.concealedSamples || 0 };
      if (r.type === "candidate-pair" && r.currentRoundTripTime != null && (r.nominated || r.selected || r.state === "succeeded")) rtt = r.currentRoundTripTime;
    });
    if (!cur) return;
    if (prevStat && cur.n > prevStat.n) {
      const jb = (cur.d - prevStat.d) / (cur.n - prevStat.n);          // seconds in the listener's buffer
      conn.send({ t: "lat", ms: Math.round((jb + rtt / 2 + 0.04) * 1000) });
      if (dl && cur.c - prevStat.c > 1920) conn.send({ t: "slow" });
    }
    prevStat = cur;
  } catch (e) {}
}

/* =====================================================================
   start
   ===================================================================== */
$("start").onclick = () => { initHostAudio(); startHost(); };
$("codeIn").addEventListener("input", e => {
  e.target.value = e.target.value.toLowerCase().replace(/[^a-z]/g, "");
  if (e.target.value.length === 3) joinRoom(e.target.value);
});
window.addEventListener("beforeunload", () => { if (peer) peer.destroy(); });
</script>
