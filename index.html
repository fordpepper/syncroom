<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sync Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e6e9f4; --paper:#f7f8fd; --ink:#12152e; --muted:#5b6082;
  --blue:#3446ff; --pink:#ff4f8b; --line:#c6cbe6;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);min-height:100vh}
main{max-width:480px;margin:0 auto;padding:28px 20px 48px}
h1{font:700 1.5rem/1.1 var(--display);margin:0 0 6px;letter-spacing:-.02em}
.sub{margin:0 0 28px;color:var(--muted)}
[hidden]{display:none!important}

.btn{font:500 1rem var(--body);border:2px solid var(--ink);background:var(--paper);color:var(--ink);
  padding:12px 18px;border-radius:12px;cursor:pointer;min-height:48px}
.btn:hover{background:#fff}
.btn:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn.primary{background:var(--ink);color:#fff}
.btn.primary:hover{background:var(--blue);border-color:var(--blue)}
.btn.live{border-color:var(--pink);color:#b0124c}
.btn.live.on{background:var(--pink);color:#fff}
.btn.block{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 auto}

.or{margin:22px 0 10px;color:var(--muted);font-size:.95rem}
.join{display:flex;gap:10px}
input[type=text]{flex:1;min-width:0;font:700 1.3rem var(--display);letter-spacing:.2em;text-transform:uppercase;
  border:2px solid var(--ink);border-radius:12px;padding:10px 14px;background:var(--paper);color:var(--ink)}

.code{font:700 2.6rem/1 var(--display);letter-spacing:.12em;margin:4px 0 12px}
.share{display:flex;gap:10px;align-items:stretch;margin-bottom:6px}
.share input{flex:1;min-width:0;font:.9rem var(--body);border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper);color:var(--ink)}

.stage{margin:28px 0 8px;display:flex;flex-direction:column;align-items:center;gap:16px}
.disc{width:min(62vw,240px);aspect-ratio:1;border-radius:50%;position:relative;
  background:conic-gradient(from 0deg,#12152e,#3446ff,#12152e,#ff4f8b,#12152e);
  animation:spin 5s linear infinite;animation-play-state:paused}
.disc.on{animation-play-state:running}
.disc::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:repeating-radial-gradient(circle,rgba(255,255,255,.1) 0 2px,transparent 2px 7px)}
.disc::after{content:"";position:absolute;inset:36%;border-radius:50%;background:var(--paper);box-shadow:0 0 0 6px var(--ink)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.disc{animation:none}}

.title{font:700 1.1rem var(--display);text-align:center;word-break:break-word;margin:0}
.meta{color:var(--muted);font-size:.95rem;text-align:center;margin:0}
.bar{width:100%;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--blue);transition:width .15s}

.controls{display:flex;align-items:center;gap:12px;width:100%}
.controls input[type=range]{flex:1;accent-color:var(--blue);min-width:0}
.time{font-variant-numeric:tabular-nums;font-size:.9rem;color:var(--muted);min-width:42px}
.panel{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:16px;margin-top:20px}
.panel h2{font:700 .95rem var(--display);margin:0 0 12px}
.note{font-size:.88rem;color:var(--muted);margin:10px 0 0}
#status{min-height:1.5em;margin-top:18px;color:var(--muted);text-align:center}
#status.err{color:#b0124c}

#gate{position:fixed;inset:0;background:rgba(18,21,46,.88);display:flex;align-items:center;justify-content:center;padding:24px;z-index:10}
#gate .box{background:var(--paper);border-radius:20px;padding:28px;max-width:360px;text-align:center}
#gate p{margin:0 0 18px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>Sync Room</h1>
  <p class="sub">One song, every device, at the same time.</p>

  <!-- HOME -->
  <section id="v-home">
    <button id="btnHost" class="btn primary block">Start a room</button>
    <div class="or">or join a room</div>
    <div class="join">
      <input id="codeIn" type="text" maxlength="5" placeholder="CODE" autocapitalize="characters" autocomplete="off" spellcheck="false" aria-label="Room code">
      <button id="btnJoin" class="btn">Join</button>
    </div>
  </section>

  <!-- ROOM (host + guest) -->
  <section id="v-room" hidden>
    <div id="hostHead" hidden>
      <div class="code" id="codeOut" aria-label="Room code"></div>
      <div class="share">
        <input id="linkOut" readonly aria-label="Invite link">
        <button id="btnCopy" class="btn">Copy</button>
        <button id="btnShare" class="btn" hidden>Share</button>
      </div>
      <p class="meta" id="guestCount" style="text-align:left">No listeners yet</p>
    </div>

    <div class="stage">
      <div class="disc" id="disc"></div>
      <p class="title" id="trackName">Nothing playing</p>
      <div class="bar" id="rxBar" hidden><i id="rxFill"></i></div>
      <p class="meta" id="modeLine"></p>
    </div>

    <!-- Host tools -->
    <div id="hostTools" hidden>
      <div class="controls">
        <button id="btnPlay" class="btn" disabled>Play</button>
        <input id="seek" type="range" min="0" max="0" step="0.1" value="0" disabled aria-label="Seek">
        <span class="time" id="tHost">0:00</span>
      </div>
      <div class="panel">
        <h2>Pick what to share</h2>
        <div class="row">
          <label class="btn primary" for="file" style="text-align:center">Upload an MP3</label>
          <button id="btnLive" class="btn live">Share live audio</button>
        </div>
        <input id="file" type="file" accept="audio/*,.mp3,.m4a,.wav,.ogg,.flac" hidden>
        <p class="note" id="liveNote"></p>
      </div>
    </div>

    <!-- Guest tools -->
    <div id="guestTools" hidden>
      <div class="controls">
        <span class="time" style="min-width:auto">Volume</span>
        <input id="vol" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume">
        <span class="time" id="tGuest">0:00</span>
      </div>
      <div class="row" style="margin-top:14px">
        <button id="btnResync" class="btn">Resync</button>
        <button id="btnLeave" class="btn">Leave</button>
      </div>
    </div>
  </section>

  <p id="status" role="status" aria-live="polite"></p>
</main>

<div id="gate" hidden>
  <div class="box">
    <p id="gateText">Tap to join the room. Browsers need one tap before they allow sound.</p>
    <button id="btnGate" class="btn primary block">Join and listen</button>
  </div>
</div>

<audio id="audio" playsinline preload="auto"></audio>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script>
"use strict";

/* ---------- Config ---------- */
// Change this to any random string so your room IDs can't collide with other apps on the public broker.
const APP_PREFIX = "syncroom-x7q2-";
const ALPHABET = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const CHUNK = 16000;
const PEER_OPTS = {
  // Default is Google STUN via PeerJS. Add a TURN server here if some networks can't connect.
  config: { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] }
};
const SILENT_WAV = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=";

/* ---------- Helpers ---------- */
const $ = id => document.getElementById(id);
const audio = $("audio");
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmt = s => { s = Math.max(0, s || 0); return Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0"); };
const randomCode = () => Array.from({ length: 5 }, () => ALPHABET[Math.floor(Math.random() * ALPHABET.length)]).join("");
function status(msg, err) { const s = $("status"); s.textContent = msg || ""; s.className = err ? "err" : ""; }
function show(view) { $("v-home").hidden = view !== "home"; $("v-room").hidden = view !== "room"; }

let peer = null, role = null, code = null;

/* =====================================================================
   HOST
   ===================================================================== */
const guests = new Map();   // peerId -> { conn, call }
let track = null;           // { id, name, mime, buffer }
let live = null;            // { raw, stream }

function startHost(attempt = 0) {
  status("Opening room…");
  code = randomCode();
  peer = new Peer(APP_PREFIX + code, PEER_OPTS);
  peer.on("open", () => {
    role = "host";
    $("codeOut").textContent = code;
    $("linkOut").value = location.origin + location.pathname + "?room=" + code;
    $("hostHead").hidden = false; $("hostTools").hidden = false; $("guestTools").hidden = true;
    if (navigator.share) $("btnShare").hidden = false;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
      $("btnLive").disabled = true;
      $("liveNote").textContent = "Live audio sharing isn't available in this browser. Use Chrome or Edge on a computer. Uploading an MP3 works everywhere.";
    } else {
      $("liveNote").textContent = "Live audio: pick a browser tab and tick “Share tab audio”. Works in Chrome and Edge on desktop.";
    }
    show("home"); show("room");
    status("Room is open. Share the code or link.");
  });
  peer.on("connection", onGuestConnection);
  peer.on("error", e => {
    if (e.type === "unavailable-id" && attempt < 5) { peer.destroy(); startHost(attempt + 1); }
    else status("Couldn't open the room: " + e.type, true);
  });
}

function onGuestConnection(conn) {
  conn.on("open", () => {
    guests.set(conn.peer, { conn, call: null });
    updateGuestCount();
    if (live) { conn.send({ t: "mode", mode: "live" }); callGuest(conn.peer); }
    else if (track) { conn.send({ t: "mode", mode: "file" }); sendTrack(conn, track); }
    else conn.send({ t: "mode", mode: "idle" });
  });
  conn.on("data", d => {
    if (d && d.t === "ping") conn.send({ t: "pong", c: d.c, h: Date.now() });
    if (d && d.t === "need-state") conn.send(currentState());
  });
  const drop = () => { guests.delete(conn.peer); updateGuestCount(); };
  conn.on("close", drop); conn.on("error", drop);
}

function updateGuestCount() {
  const n = guests.size;
  $("guestCount").textContent = n === 0 ? "No listeners yet" : n + (n === 1 ? " listener connected" : " listeners connected");
}

function broadcast(msg) { guests.forEach(g => { if (g.conn.open) g.conn.send(msg); }); }

function currentState() {
  return { t: "state", id: track ? track.id : null, playing: !audio.paused, pos: audio.currentTime, at: Date.now() };
}

async function sendTrack(conn, tr) {
  const buf = tr.buffer, total = Math.ceil(buf.byteLength / CHUNK);
  conn.send({ t: "meta", id: tr.id, name: tr.name, mime: tr.mime, total });
  for (let i = 0; i < total; i++) {
    if (!track || track.id !== tr.id || !conn.open) return;
    while (conn.dataChannel && conn.dataChannel.bufferedAmount > 512 * 1024) await sleep(30);
    conn.send({ t: "chunk", id: tr.id, i, d: buf.slice(i * CHUNK, (i + 1) * CHUNK) });
  }
  if (conn.open) conn.send(currentState());
}

$("file").addEventListener("change", async e => {
  const f = e.target.files[0];
  if (!f || role !== "host") return;
  if (live) stopLive(true);
  status("Loading " + f.name + "…");
  const buffer = await f.arrayBuffer();
  track = { id: Date.now(), name: f.name, mime: f.type || "audio/mpeg", buffer };
  if (audio.src && audio.src.startsWith("blob:")) URL.revokeObjectURL(audio.src);
  audio.srcObject = null;
  audio.src = URL.createObjectURL(new Blob([buffer], { type: track.mime }));
  $("trackName").textContent = f.name.replace(/\.[^.]+$/, "");
  $("modeLine").textContent = "Ready. Press play.";
  $("btnPlay").disabled = false; $("seek").disabled = false;
  broadcast({ t: "mode", mode: "file" });
  guests.forEach(g => sendTrack(g.conn, track));
  status("");
  e.target.value = "";
});

$("btnPlay").addEventListener("click", () => {
  if (live) return;
  if (audio.paused) audio.play().catch(() => status("Couldn't start playback.", true)); else audio.pause();
});
$("seek").addEventListener("input", e => { audio.currentTime = +e.target.value; });

["play", "pause", "seeked"].forEach(ev => audio.addEventListener(ev, () => { if (role === "host" && track && !live) broadcast(currentState()); }));
setInterval(() => { if (role === "host" && track && !live && !audio.paused) broadcast(currentState()); }, 2000);

audio.addEventListener("timeupdate", () => {
  if (role === "host" && track) {
    $("seek").max = audio.duration || 0; $("seek").value = audio.currentTime;
    $("tHost").textContent = fmt(audio.currentTime);
  }
});
audio.addEventListener("play", () => { $("disc").classList.add("on"); if (role === "host") $("btnPlay").textContent = "Pause"; });
audio.addEventListener("pause", () => { $("disc").classList.remove("on"); if (role === "host") $("btnPlay").textContent = "Play"; });

/* ----- Live audio (tab / system capture) ----- */
function callGuest(id) {
  const g = guests.get(id);
  if (!g || !live) return;
  g.call = peer.call(id, live.stream);
}

async function startLive() {
  try {
    const raw = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
    const tracks = raw.getAudioTracks();
    if (!tracks.length) {
      raw.getTracks().forEach(t => t.stop());
      status("No audio was captured. Pick a browser tab and tick “Share tab audio”.", true);
      return;
    }
    audio.pause();
    live = { raw, stream: new MediaStream(tracks) };
    tracks[0].addEventListener("ended", () => stopLive());
    raw.getVideoTracks().forEach(v => v.addEventListener("ended", () => stopLive()));
    $("btnLive").classList.add("on"); $("btnLive").textContent = "Stop live audio";
    $("btnPlay").disabled = true; $("seek").disabled = true;
    $("trackName").textContent = "Live audio";
    $("modeLine").textContent = "Streaming what this tab is playing.";
    $("disc").classList.add("on");
    broadcast({ t: "mode", mode: "live" });
    guests.forEach((_, id) => callGuest(id));
    status("");
  } catch (err) {
    status("Live sharing was cancelled or isn't allowed.", true);
  }
}

function stopLive(silent) {
  if (!live) return;
  const l = live; live = null;
  l.raw.getTracks().forEach(t => t.stop());
  guests.forEach(g => { if (g.call) { g.call.close(); g.call = null; } });
  $("btnLive").classList.remove("on"); $("btnLive").textContent = "Share live audio";
  $("disc").classList.remove("on");
  if (!silent) {
    if (track) {
      $("trackName").textContent = track.name.replace(/\.[^.]+$/, "");
      $("modeLine").textContent = "Ready. Press play.";
      $("btnPlay").disabled = false; $("seek").disabled = false;
      broadcast({ t: "mode", mode: "file" });
      broadcast(currentState());
    } else {
      $("trackName").textContent = "Nothing playing"; $("modeLine").textContent = "";
      broadcast({ t: "mode", mode: "idle" });
    }
  }
}
$("btnLive").addEventListener("click", () => { live ? stopLive() : startLive(); });

$("btnCopy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText($("linkOut").value); status("Link copied."); }
  catch { $("linkOut").select(); status("Press and hold the link to copy it."); }
});
$("btnShare").addEventListener("click", () => {
  navigator.share({ title: "Sync Room", text: "Listen along with me", url: $("linkOut").value }).catch(() => {});
});

/* =====================================================================
   GUEST
   ===================================================================== */
let conn = null, offset = 0, bestRtt = Infinity, pingTimer = null;
let rx = null, loadedId = null, lastState = null, gateOpen = false, pendingCode = null;

function joinRoom(c) {
  pendingCode = c.toUpperCase().trim();
  if (pendingCode.length !== 5) { status("Room codes have 5 characters.", true); return; }
  $("gate").hidden = false;                 // a tap is required to unlock audio
}

$("btnGate").addEventListener("click", () => {
  // Unlock audio on iOS / Android / desktop: play something silent inside the user's tap.
  audio.src = SILENT_WAV;
  audio.play().then(() => audio.pause()).catch(() => {});
  $("gate").hidden = true; gateOpen = true;
  startGuest(pendingCode);
});

function startGuest(c) {
  status("Connecting…");
  code = c;
  peer = new Peer(PEER_OPTS);
  peer.on("open", () => {
    conn = peer.connect(APP_PREFIX + code, { reliable: true });
    conn.on("open", () => {
      role = "guest";
      $("hostHead").hidden = true; $("hostTools").hidden = true; $("guestTools").hidden = false;
      $("trackName").textContent = "Connected to " + code;
      $("modeLine").textContent = "Waiting for the host to start something.";
      show("room"); status("");
      sendPing(); pingTimer = setInterval(sendPing, 2000);
    });
    conn.on("data", onHostData);
    conn.on("close", () => { clearInterval(pingTimer); status("Disconnected from the room. Reload to rejoin.", true); $("disc").classList.remove("on"); audio.pause(); });
    conn.on("error", () => status("Connection problem.", true));
  });
  peer.on("call", call => {
    call.answer();
    call.on("stream", s => {
      audio.srcObject = s;
      audio.play().catch(() => status("Tap Resync to start the sound.", true));
    });
  });
  peer.on("error", e => {
    if (e.type === "peer-unavailable") status("No room with code " + code + ". Check the code and try again.", true);
    else status("Connection error: " + e.type, true);
  });
}

function sendPing() { if (conn && conn.open) conn.send({ t: "ping", c: Date.now() }); }

function onHostData(d) {
  if (!d || !d.t) return;
  switch (d.t) {
    case "pong": {
      const now = Date.now(), rtt = now - d.c;
      if (rtt <= bestRtt * 1.5 || bestRtt === Infinity) { bestRtt = Math.min(bestRtt, rtt) * 0.9 + rtt * 0.1; offset = d.h - (d.c + rtt / 2); }
      break;
    }
    case "mode":
      if (d.mode === "live") {
        resetFile();
        $("trackName").textContent = "Live audio"; $("modeLine").textContent = "Streaming from the host.";
      } else if (d.mode === "idle") {
        resetFile(); audio.pause(); $("trackName").textContent = "Nothing playing"; $("modeLine").textContent = "";
      } else {
        audio.srcObject = null;
      }
      break;
    case "meta":
      audio.pause(); audio.srcObject = null; loadedId = null; lastState = null;
      rx = { id: d.id, name: d.name, mime: d.mime, total: d.total, parts: new Array(d.total), got: 0 };
      $("trackName").textContent = d.name.replace(/\.[^.]+$/, "");
      $("modeLine").textContent = "Receiving…"; $("rxBar").hidden = false; $("rxFill").style.width = "0%";
      break;
    case "chunk":
      if (!rx || rx.id !== d.id) return;
      rx.parts[d.i] = d.d; rx.got++;
      $("rxFill").style.width = (rx.got / rx.total * 100) + "%";
      if (rx.got === rx.total) finishReceive();
      break;
    case "state":
      lastState = d; applyState();
      break;
  }
}

function resetFile() {
  loadedId = null; lastState = null; rx = null; $("rxBar").hidden = true;
  if (audio.src && audio.src.startsWith("blob:")) { URL.revokeObjectURL(audio.src); }
  audio.removeAttribute("src");
}

function finishReceive() {
  const blob = new Blob(rx.parts, { type: rx.mime });
  if (audio.src && audio.src.startsWith("blob:")) URL.revokeObjectURL(audio.src);
  audio.srcObject = null;
  audio.src = URL.createObjectURL(blob);
  loadedId = rx.id; rx = null;
  $("rxBar").hidden = true; $("modeLine").textContent = "Synced with the host.";
  if (conn && conn.open) conn.send({ t: "need-state" });
  applyState();
}

function applyState() {
  const s = lastState;
  if (!s || s.id == null || s.id !== loadedId) return;
  const run = () => {
    const hostNow = Date.now() + offset;
    const target = s.pos + (s.playing ? (hostNow - s.at) / 1000 : 0);
    if (Math.abs(audio.currentTime - target) > 0.3) audio.currentTime = Math.max(0, target);
    if (s.playing && audio.paused) audio.play().catch(() => status("Tap Resync to start the sound.", true));
    else if (!s.playing && !audio.paused) audio.pause();
  };
  if (audio.readyState < 1) audio.addEventListener("loadedmetadata", run, { once: true }); else run();
}

audio.addEventListener("timeupdate", () => { if (role === "guest") $("tGuest").textContent = fmt(audio.currentTime); });
$("vol").addEventListener("input", e => { audio.volume = +e.target.value; });
$("btnResync").addEventListener("click", () => {
  if (audio.srcObject) { audio.play().catch(() => {}); return; }
  if (conn && conn.open) conn.send({ t: "need-state" });
  applyState();
  status("");
});
$("btnLeave").addEventListener("click", () => { location.href = location.pathname; });

/* =====================================================================
   Boot
   ===================================================================== */
$("btnHost").addEventListener("click", startHost);
$("btnJoin").addEventListener("click", () => joinRoom($("codeIn").value));
$("codeIn").addEventListener("keydown", e => { if (e.key === "Enter") joinRoom($("codeIn").value); });

(function boot() {
  const q = new URLSearchParams(location.search).get("room") || location.hash.replace("#", "");
  if (q && q.length === 5) { $("codeIn").value = q.toUpperCase(); joinRoom(q); }
  window.addEventListener("beforeunload", () => { if (peer) peer.destroy(); });
})();
</script>
</body>
</html>
