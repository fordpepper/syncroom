:root{--ink:#161616;--bg:#f6f5f1;--dim:#8d8d86}
*{box-sizing:border-box;text-transform:lowercase}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:24px/1.25 bw,"Segoe Print","Comic Sans MS",cursive,sans-serif;
  display:flex;align-items:center;justify-content:center;min-height:100dvh;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);-webkit-tap-highlight-color:transparent}
main{width:min(420px,100%);padding:24px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
section{width:100%;display:flex;flex-direction:column;align-items:center;gap:18px}
[hidden]{display:none!important}
button,.btn,input{font:inherit;color:inherit}
button,.btn{background:none;border:0;border-bottom:2px solid var(--ink);border-radius:0;padding:2px 4px;cursor:pointer}
button:disabled{opacity:.3;cursor:default}
button:focus-visible,.btn:focus-within,input:focus-visible{outline:2px dashed var(--ink);outline-offset:4px}
.big{font-size:40px}
.row{display:flex;gap:22px;align-items:center;justify-content:center;flex-wrap:wrap}
.dim{color:var(--dim)}
.small{font-size:19px}
#codeIn{width:6.5em;text-align:center;background:none;border:0;border-bottom:2px solid var(--ink);border-radius:0;padding:2px;letter-spacing:.08em}
#codeIn::placeholder{color:var(--dim)}

/* the code: labelled and boxed with a hand-drawn border */
.codebox{display:flex;flex-direction:column;align-items:center;gap:6px}
#code{font-size:80px;line-height:1;letter-spacing:.12em;padding:6px 6px 10px calc(6px + .12em);
  border:3px solid var(--ink);border-radius:255px 18px 225px 18px/18px 225px 18px 255px}

#title,#gtitle{font-size:30px;word-break:break-word;min-height:1.25em}
input[type=range]{width:100%;accent-color:var(--ink);margin:0}
.slider{width:100%;display:flex;flex-direction:column;gap:2px}
.slider span{font-size:18px;color:var(--dim)}

/* hand-drawn icon buttons */
.ic{border:0;padding:6px;line-height:0;display:inline-flex}
.ic svg{width:34px;height:34px;fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ic.main svg{width:56px;height:56px;stroke-width:2.6}

#queue{width:100%;max-height:24vh;overflow:auto;font-size:19px}
#queue button{display:block;width:100%;border:0;padding:3px 0;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#queue button.cur{color:var(--ink);text-decoration:underline}
#msg{min-height:1.25em;font-size:18px;color:var(--dim)}
</style>
</head>
<body>
<main>
  <section id="v-home">
    <button id="start" class="big">start</button>
    <input id="codeIn" maxlength="3" placeholder="enter code" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="room code">
  </section>

  <section id="v-gate" hidden>
    <button id="enter" class="big">tap to listen</button>
  </section>

  <section id="v-host" hidden>
    <div class="codebox">
      <span class="dim small">room code</span>
      <div id="code"></div>
    </div>
    <div class="row small dim"><span id="count">0 listening</span><button id="invite" class="small">invite link</button></div>

    <div id="title">add music</div>

    <div class="slider">
      <input id="seek" type="range" min="0" max="0" step="0.1" value="0" disabled aria-label="position">
      <span id="time">0:00 / 0:00</span>
    </div>

    <div class="row" style="gap:14px">
      <button id="prev" class="ic" aria-label="previous">
        <svg viewBox="0 0 32 32" style="transform:scaleX(-1)"><path d="M6.5 7C6.2 12 6.4 19 6.7 25C11.5 22 16.5 19 21.5 16C16.5 13 11.5 10 6.5 7Z"/><path d="M25.6 6C25.2 12 25.9 20 25.3 26"/></svg>
      </button>
      <button id="play" class="ic main" aria-label="play">
        <svg id="iPlay" viewBox="0 0 32 32"><path d="M10 5.5C9.4 12 9.7 20 10.2 26.5C15 23.5 21 19.6 26.3 16.2C21 13 15 9 10 5.5Z"/></svg>
        <svg id="iPause" viewBox="0 0 32 32" hidden><path d="M11 6C10.5 12 10.9 20 11.3 26"/><path d="M21.2 6.4C21.6 12 21.1 20 20.8 25.7"/></svg>
      </button>
      <button id="next" class="ic" aria-label="next">
        <svg viewBox="0 0 32 32"><path d="M6.5 7C6.2 12 6.4 19 6.7 25C11.5 22 16.5 19 21.5 16C16.5 13 11.5 10 6.5 7Z"/><path d="M25.6 6C25.2 12 25.9 20 25.3 26"/></svg>
      </button>
    </div>

    <div class="slider">
      <input id="vol" type="range" min="0" max="1" step="0.01" value="1" aria-label="volume">
      <span>volume</span>
    </div>

    <div class="row small">
      <label class="btn" for="files">add music</label>
      <button id="mode" class="small">in order</button>
      <button id="clear" class="small">clear</button>
    </div>
    <input id="files" type="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.opus,.flac" multiple hidden>

    <div id="queue"></div>
  </section>

  <section id="v-guest" hidden>
    <div id="gtitle"></div>
    <div id="gsub" class="dim small"></div>
    <button id="rejoin" class="small" hidden>rejoin</button>
  </section>

  <div id="msg" role="status" aria-live="polite"></div>
</main>

<script>
"use strict";
// change PREFIX to any random string so your rooms can't collide with other apps.
// BITRATE is the opus bitrate in bits/s sent to every listener (lower = better on bad wifi).
const PREFIX = "syncroom-x7q2-", ALPHA = "abcdefghjkmnpqrstuvwxyz23456789", BITRATE = 64000;
const SILENT = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=";
const $ = id => document.getElementById(id), audio = $("audio");
const fmt = s => { s = Math.max(0, s || 0); return Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0"); };
const clean = n => n.replace(/\.[^.]+$/, "");
const view = v => ["home", "gate", "host", "guest"].forEach(x => $("v-" + x).hidden = x !== v);
const msg = t => { $("msg").textContent = t || ""; };
const shuffleArr = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let peer = null, role = null, code = null;

// stereo opus tuned for music: fixed modest bitrate, forward error correction, no silence gaps
function opusSdp(sdp) {
  const m = sdp.match(/a=rtpmap:(\d+) opus\/48000\/2/);
  if (!m) return sdp;
  const pt = m[1];
  const params = "minptime=10;useinbandfec=1;stereo=1;sprop-stereo=1;cbr=0;usedtx=0;maxplaybackrate=48000;maxaveragebitrate=" + BITRATE;
  const re = new RegExp("a=fmtp:" + pt + " [^\\r\\n]*");
  return re.test(sdp) ? sdp.replace(re, "a=fmtp:" + pt + " " + params) : sdp.replace(m[0], m[0] + "\r\na=fmtp:" + pt + " " + params);
}

/* =====================================================================
   host: plays the queue and streams the sound live to every listener
   ===================================================================== */
const guests = new Map();            // peerId -> { conn, call }
const tracks = new Map();            // id -> { id, name, file }
let queue = [], order = [], pos = -1, nextId = 1, shuffle = false, curUrl = null;

  ctx = new AC();
  const src = ctx.createMediaElementSource(audio);
  master = ctx.createGain();                 // one volume for this device and for everyone listening
  dest = ctx.createMediaStreamDestination(); // what listeners receive
  src.connect(master); master.connect(ctx.destination); master.connect(dest);
  try { dest.stream.getAudioTracks()[0].contentHint = "music"; } catch (e) {}
  ctx.resume();
}
async function keepAwake() {
  try { if (navigator.wakeLock) wake = await navigator.wakeLock.request("screen"); } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (role === "host" && document.visibilityState === "visible") { keepAwake(); if (ctx) ctx.resume(); } });

function startHost(n = 0) {
  msg("");
  code = Array.from({ length: 3 }, () => ALPHA[Math.floor(Math.random() * ALPHA.length)]).join("");
  peer = new Peer(PREFIX + code);
  peer.on("open", () => { role = "host"; $("code").textContent = code; view("host"); keepAwake(); });
  peer.on("connection", onGuest);
  peer.on("disconnected", () => { try { peer.reconnect(); } catch (e) {} });
  peer.on("error", e => {
    if (e.type === "unavailable-id" && n < 8) { peer.destroy(); startHost(n + 1); }
    else msg(e.type);
  });
}

function onGuest(conn) {
  conn.on("open", () => {
    const g = { conn, call: null };
    guests.set(conn.peer, g); count();
    conn.send(nowMsg());
    g.call = peer.call(conn.peer, dest.stream, { sdpTransform: opusSdp });
  });
  const drop = () => { const g = guests.get(conn.peer); if (g && g.call) g.call.close(); guests.delete(conn.peer); count(); };
  conn.on("close", drop); conn.on("error", drop);
}
const count = () => { $("count").textContent = guests.size + " listening"; };
const nowMsg = () => ({ t: "now", name: pos >= 0 ? clean(tracks.get(order[pos]).name) : "" });
const broadcast = m => guests.forEach(g => { if (g.conn.open) g.conn.send(m); });

/* ----- queue ----- */
function select(p, play) {
  if (!order.length) return;
  pos = ((p % order.length) + order.length) % order.length;
  const t = tracks.get(order[pos]);
  if (curUrl) URL.revokeObjectURL(curUrl);
  curUrl = URL.createObjectURL(t.file);
  audio.src = curUrl;
  if (play) { ctx.resume(); audio.play().catch(() => msg("tap play")); }
  $("title").textContent = clean(t.name);
  ui(); renderQueue(); broadcast(nowMsg());
}

function addFiles(list) {
  const fs = [...list].filter(f => /^audio\//.test(f.type) || /\.(mp3|m4a|aac|wav|ogg|oga|opus|flac)$/i.test(f.name));
  if (!fs.length) { msg("no audio found"); return; }
  msg("");
  fs.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
  const first = pos < 0;
  for (const f of fs) {
    const id = nextId++;
    tracks.set(id, { id, name: f.name, file: f }); queue.push(id);
    if (shuffle && order.length) {
      const lo = Math.min(order.length, pos + 2);
      order.splice(lo + Math.floor(Math.random() * (order.length - lo + 1)), 0, id);
    } else order.push(id);
  }
  if (first) { if (shuffle) shuffleArr(order); select(0, false); }
  else renderQueue();
}

function reorder() {
  const cur = pos >= 0 ? order[pos] : null;
  if (!shuffle) { order = queue.slice(); pos = cur == null ? -1 : order.indexOf(cur); }
  else {
    const rest = shuffleArr(queue.filter(i => i !== cur));
    order = cur == null ? rest : [cur, ...rest]; pos = order.length ? 0 : -1;
  }
  renderQueue();
}

function renderQueue() {
  const q = $("queue"); q.textContent = "";
  order.forEach((id, i) => {
    const b = document.createElement("button");
    b.textContent = clean(tracks.get(id).name);
    if (i === pos) b.className = "cur";
    b.onclick = () => select(i, true);
    q.appendChild(b);
  });
}

function clearAll() {
  audio.pause(); audio.removeAttribute("src"); audio.load();
  if (curUrl) { URL.revokeObjectURL(curUrl); curUrl = null; }
  queue = []; order = []; pos = -1; tracks.clear();
  $("title").textContent = "add music";
  ui(); renderQueue(); broadcast(nowMsg());
}

function ui() {
  const has = pos >= 0;
  ["seek", "play", "prev", "next"].forEach(i => $(i).disabled = !has);
  $("iPlay").toggleAttribute("hidden", !audio.paused); $("iPause").toggleAttribute("hidden", audio.paused);
  $("play").setAttribute("aria-label", audio.paused ? "play" : "pause");
}

/* ----- host controls ----- */
$("files").addEventListener("change", e => { addFiles(e.target.files); e.target.value = ""; });
$("play").onclick = () => { ctx.resume(); if (audio.paused) audio.play().catch(() => {}); else audio.pause(); };
$("prev").onclick = () => select(pos - 1, true);
$("next").onclick = () => select(pos + 1, true);
$("mode").onclick = () => { shuffle = !shuffle; $("mode").textContent = shuffle ? "shuffle" : "in order"; reorder(); };
$("clear").onclick = clearAll;
$("vol").addEventListener("input", e => { if (master) master.gain.value = e.target.value * e.target.value; });
let seeking = false;
$("seek").addEventListener("input", () => { seeking = true; $("time").textContent = fmt(+$("seek").value) + " / " + fmt(audio.duration); });
$("seek").addEventListener("change", () => { audio.currentTime = +$("seek").value; seeking = false; });

$("invite").onclick = async () => {
  const url = location.origin + location.pathname + "?r=" + code;
  if (navigator.share) { try { await navigator.share({ url }); return; } catch (e) { if (e.name === "AbortError") return; } }
  try { await navigator.clipboard.writeText(url); $("invite").textContent = "copied"; setTimeout(() => $("invite").textContent = "invite link", 1500); }
  catch (e) { msg(url); }
};

audio.addEventListener("play", () => { if (role === "host") ui(); });
audio.addEventListener("pause", () => { if (role === "host") ui(); });
audio.addEventListener("ended", () => { if (role === "host") select(pos + 1, true); });
audio.addEventListener("timeupdate", () => {
  if (role !== "host" || seeking) return;
  $("seek").max = audio.duration || 0; $("seek").value = audio.currentTime;
  $("time").textContent = fmt(audio.currentTime) + " / " + fmt(audio.duration);
});
audio.addEventListener("loadedmetadata", () => { if (role === "host") $("seek").max = audio.duration || 0; });

// desktop: drop files and folders together anywhere on the page
async function walk(entry, out) {
  if (entry.isFile) out.push(await new Promise(r => entry.file(r)));
  else {
    const rd = entry.createReader(); let batch;
    do { batch = await new Promise(r => rd.readEntries(r)); for (const e of batch) await walk(e, out); } while (batch.length);
  }
}
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", async e => {
  e.preventDefault();
  if (role !== "host") return;
  const entries = [...e.dataTransfer.items].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  const out = []; for (const en of entries) await walk(en, out);
  addFiles(out);
});

/* =====================================================================
   listener
   ===================================================================== */
let conn = null, pendingCode = null;

function joinRoom(c) {
  pendingCode = c.toLowerCase().replace(/[^a-z0-9]/g, "");
  if (pendingCode.length !== 3) return;
  msg(""); view("gate");
}

function startGuest(c) {
  code = c; msg("connecting");
  peer = new Peer();
  peer.on("call", call => {
    call.answer(undefined, { sdpTransform: opusSdp });
    call.on("stream", s => {
      audio.srcObject = s;
      audio.play().catch(() => msg("tap anywhere to hear it"));
      // a slightly deeper buffer rides out bad wifi (hint; ignored where unsupported)
      try { call.peerConnection.getReceivers().forEach(r => { if ("jitterBufferTarget" in r) r.jitterBufferTarget = 300; }); } catch (e) {}
      $("gsub").textContent = "";
    });
    call.on("close", () => { $("gsub").textContent = "disconnected"; $("rejoin").hidden = false; });
  });
  peer.on("open", () => {
    conn = peer.connect(PREFIX + code, { reliable: true });
    conn.on("open", () => { role = "guest"; msg(""); view("guest"); $("gtitle").textContent = code; $("gsub").textContent = "connecting"; });
    conn.on("data", d => { if (d && d.t === "now") $("gtitle").textContent = d.name || code; });
    conn.on("close", () => { audio.pause(); $("gsub").textContent = "disconnected"; $("rejoin").hidden = false; });
  });
  peer.on("error", e => {
    if (e.type === "peer-unavailable") { msg("no room " + code); $("codeIn").value = ""; view("home"); }
    else msg(e.type);
  });
}

$("enter").onclick = () => {
  // one tap unlocks sound on ios / android
  audio.src = SILENT; audio.play().then(() => audio.pause()).catch(() => {});
  startGuest(pendingCode);
};
document.addEventListener("pointerdown", () => { if (role === "guest" && audio.srcObject && audio.paused) audio.play().catch(() => {}); });
$("rejoin").onclick = () => { location.href = location.pathname + "?r=" + code; };

/* =====================================================================
   start
   ===================================================================== */
$("start").onclick = () => { initHostAudio(); startHost(); };
$("codeIn").addEventListener("input", e => { e.target.value = e.target.value.toLowerCase().replace(/[^a-z0-9]/g, ""); if (e.target.value.length === 3) joinRoom(e.target.value); });
(function () {
  const r = new URLSearchParams(location.search).get("r");
  if (r) joinRoom(r);
  window.addEventListener("beforeunload", () => { if (peer) peer.destroy(); });
})();
</script>
</body>
